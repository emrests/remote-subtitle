<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>remote-subtitle</title>
<style>
  /* Saydam: altında TVWindow ile HDMI (PS5) görüntüsü oynar */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #overlay { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; background: transparent; }
  #setup {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 13, 20, .92); color: #e8ecf4; font: 32px/1.45 "Samsung One", "Tizen Sans", sans-serif;
  }
  #setup .card { width: 1100px; background: #191f2c; border: 1px solid #2e3850; border-radius: 20px; padding: 56px 64px; }
  #setup h1 { margin: 0 0 12px; font-size: 48px; font-weight: 600; }
  #setup p { margin: 0 0 28px; color: #8e9ab3; }
  #setup label { display: block; margin: 24px 0 10px; color: #8e9ab3; }
  #setup input {
    width: 100%; box-sizing: border-box; font: inherit; color: #e8ecf4; background: #222a3b;
    border: 2px solid #2e3850; border-radius: 12px; padding: 14px 20px;
  }
  #setup input:focus { border-color: #f2c94c; outline: none; }
  #setup .keys { margin-top: 36px; font-size: 26px; color: #8e9ab3; }
  #setup .keys b { color: #f2c94c; font-weight: 600; }
  #toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 14px 28px;
    border-radius: 12px; background: rgba(25, 31, 44, .95); color: #e8ecf4; font: 28px sans-serif; display: none; }
</style>
</head>
<body>
<iframe id="overlay" allowtransparency="true"></iframe>

<div id="setup">
  <div class="card">
    <h1>remote-subtitle</h1>
    <p>Bilgisayardaki uygulamanın Bağlantı bölümünde yazan adresi girin. PS5'in bağlı olduğu HDMI girişini seçin.</p>
    <label for="pc">Bilgisayarın adresi</label>
    <input id="pc" type="text" placeholder="192.168.1.20" inputmode="decimal">
    <label for="hdmi">PS5'in bağlı olduğu HDMI girişi (1, 2, 3…)</label>
    <input id="hdmi" type="text" placeholder="1" inputmode="numeric">
    <div class="keys"><b>OK</b> kaydet ve başlat · <b>Kırmızı tuş</b> bu ekranı aç · <b>Geri</b> çıkış</div>
  </div>
</div>
<div id="toast"></div>

<script src="main.js"></script>
</body>
</html>
